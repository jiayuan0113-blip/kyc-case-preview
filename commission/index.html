.cx{--paper:#f0f0f0;--surface:#fcfcfc;--sunk:#f0f0f0;--ink:#202020;--ink2:#646464;--ink3:#838383;--rule:#e0e0e0;--rule2:#cecece;--r-sm:8px;--r-md:12px;--r-lg:20px;--accent:#202020;--accent-soft:#e8e8e8;--ok:#218358;--ok-soft:#eaf4ee;--good:#218358;--good-soft:#eaf4ee;--bad:#b8262b;--bad-soft:#fbf0f0;--amber:#9a5b00;--amber-line:#e9a83a;--amber-soft:#f9f1dd;--warn:#9a5b00;--warn-soft:#f9f1dd;--red9:#d84a4f;--green9:#30a46c;--amber9:#f3b52a;--focus:#2F6FDB;background:var(--paper);color:var(--ink);
font:14px/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC",sans-serif;min-height:100vh}
@media (prefers-color-scheme:dark){.cx{--paper:#111111;--surface:#191919;--sunk:#222222;--ink:#eeeeee;--ink2:#b4b4b4;--ink3:#7b7b7b;--rule:#2a2a2a;--rule2:#3a3a3a;--accent:#eeeeee;--accent-soft:#2a2a2a;--ok:#3dd68c;--ok-soft:#132d21;--good:#3dd68c;--good-soft:#132d21;--bad:#ff9592;--bad-soft:#3b1219;--amber:#ffca16;--amber-line:#ffc53d;--amber-soft:#302008;--warn:#ffca16;--warn-soft:#302008;--red9:#e5484d;--green9:#30a46c;--amber9:#ffc53d;--focus:#8ab4f8;}}
.cx *{box-sizing:border-box}
:where(.cx) button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.cx button:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r-sm)}
.cx .num{font-variant-numeric:tabular-nums}
.cx-wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.cx-top{background:var(--surface);box-shadow:0 1px 0 var(--rule);padding:22px 0 18px}
.cx-eyebrow{font-size:13px;color:var(--ink2)}
.cx-sub{color:var(--ink2);font-size:13.5px;margin-top:7px}
.cx-sec{margin-top:26px}
.cx-sec h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:0 0 10px;font-weight:600}
.cx-card{background:var(--surface);border:0;border-radius:var(--r-lg);box-shadow:0 1px 0 var(--rule);overflow:hidden}
.cx-tbl-wrap{padding:0 16px}
.cx-tbl{width:calc(100% - 32px);margin:0 16px;border-collapse:collapse;font-size:13px}
.cx-tbl th{text-align:left;font-weight:600;color:var(--ink3);font-size:11.5px;letter-spacing:.04em;
text-transform:uppercase;padding:10px 6px;border-bottom:1px solid var(--rule)}
.cx-tbl td{padding:11px 6px;border-bottom:1px solid var(--rule);vertical-align:top}
.cx-tbl tr:last-child td{border-bottom:0}
.cx-tbl .r{text-align:right}
.cx-tag{display:inline-block;border:1px solid var(--rule2);border-radius:999px;padding:1px 8px;font-size:11.5px;color:var(--ink2)}
.cx-foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:11px 12px;background:var(--sunk);
border-top:1px solid var(--rule);font-size:13px}
.cx-foot b{font-variant-numeric:tabular-nums}
.cx-bar{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px;border-bottom:1px solid var(--rule)}
.cx-bar:last-child{border-bottom:0}
.cx-bar .cause{flex:1 1 auto;color:var(--ink2)}
.cx-bar .val{font-variant-numeric:tabular-nums;font-weight:600;min-width:104px;text-align:right}
.cx-bar .val.down{color:var(--bad)}
.cx-bar .val.up{color:var(--good)}
.cx-note{font-size:12.5px;color:var(--ink3);margin-top:8px;line-height:1.55}
.cx-kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13px;padding:0 14px 12px}
.cx-kv dt{color:var(--ink3)}
.cx-kv dd{margin:0}
.cx-disc{width:100%;display:flex;align-items:center;gap:10px;padding:11px 14px;text-align:left}
.cx-disc:hover{background:var(--sunk)}
.cx-disc .caret{color:var(--ink3);font-size:11px;width:10px;flex:0 0 auto;transition:transform .12s}
.cx-disc.open .caret{transform:rotate(90deg)}
.cx-disc .lead{font-weight:600;flex:0 0 auto}
.cx-disc .gist{color:var(--ink2);font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cx-files{margin:0;padding:0;list-style:none}
.cx-files li{display:flex;gap:10px;align-items:baseline;padding:3px 0}
.cx-files .what{color:var(--ink3);flex:0 0 96px}
.cx-files .fn{word-break:break-all}
.cx-fp{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums;word-break:break-all}
.cx-more{font-size:12px;color:var(--ink2);text-decoration:underline;text-underline-offset:2px;padding:2px 0}
.cx-end{margin:28px 0 80px;padding-top:14px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink2)}
.cx-empty{padding:16px;color:var(--ink3);font-size:13px}
.cx-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.cx-status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;
font-weight:600;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.cx-status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.cx-big{margin:6px 0 0;font-size:34px;line-height:1.1;font-weight:650;letter-spacing:-0.015em;font-variant-numeric:tabular-nums}
.cx-big .ccy{font-size:18px;font-weight:600;color:var(--ink2);margin-right:6px;letter-spacing:0}
.cx-big .to{font-size:15px;font-weight:400;color:var(--ink2);margin-left:10px;letter-spacing:0}
.cx-split{display:flex;gap:3px;height:14px;margin-top:18px}
.cx-split button{height:100%;border-radius:var(--r-sm);background:var(--rule2);min-width:6px;transition:background .12s}
.cx-split button:hover{background:var(--ink3)}
.cx-split button.on{background:var(--accent)}
.cx-legend{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:10px}
.cx-legend button{display:flex;align-items:baseline;gap:8px;border:0;background:var(--surface);border-radius:var(--r-lg);box-shadow:0 1px 0 var(--rule);padding:6px 11px}
.cx-legend button:hover{background:var(--sunk)}
.cx-legend button.on{border-color:var(--accent);background:var(--accent-soft)}
.cx-legend .nm{font-weight:600}
.cx-legend .amt{font-variant-numeric:tabular-nums;color:var(--ink2)}
.cx-legend .on .amt{color:var(--ink)}
.cx-legend .pct{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.cx-sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px}
.cx-sechead h2{margin:0}
.cx-dots{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--ink2)}
.cx-dots i{width:9px;height:9px;border-radius:50%;background:var(--good)}
.cx-dots i.miss{background:none;border:2px solid var(--bad)}
.cx-dots span{margin-left:6px;font-variant-numeric:tabular-nums}
.cx-items{background:var(--surface);border:0;border-radius:var(--r-lg);box-shadow:0 1px 0 var(--rule);overflow:hidden}
.cx-item{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;
border-bottom:1px solid var(--rule)}
.cx-item:last-child{border-bottom:0}
.cx-ico{width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.cx-ico.bad{background:var(--bad-soft);color:var(--bad)}
.cx-ico.adj{background:var(--accent-soft);color:var(--accent)}
.cx-ico.ok{background:var(--sunk);color:var(--good)}
.cx-item .t{font-weight:600}
.cx-item .d{color:var(--ink2);margin-top:1px;overflow-wrap:anywhere}
.cx-item .src{display:inline-block;margin-left:6px;font-size:12px;color:var(--ink3);white-space:nowrap}
.cx-item .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.cx-item .v.bad{color:var(--bad)}
.cx-item .v.muted{color:var(--ink3);font-weight:500}
