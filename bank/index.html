.bs{--paper:#f0f0f0;--surface:#fcfcfc;--sunk:#f0f0f0;--ink:#202020;--ink2:#646464;--ink3:#838383;--rule:#e0e0e0;--rule2:#cecece;--r-sm:8px;--r-md:12px;--r-lg:20px;--accent:#202020;--accent-soft:#e8e8e8;--ok:#218358;--ok-soft:#eaf4ee;--good:#218358;--good-soft:#eaf4ee;--bad:#b8262b;--bad-soft:#fbf0f0;--amber:#9a5b00;--amber-line:#e9a83a;--amber-soft:#f9f1dd;--warn:#9a5b00;--warn-soft:#f9f1dd;--red9:#d84a4f;--green9:#30a46c;--amber9:#f3b52a;--focus:#2F6FDB;background:var(--paper);color:var(--ink);
font:14px/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC",sans-serif;min-height:100vh}
@media (prefers-color-scheme:dark){.bs{--paper:#111111;--surface:#191919;--sunk:#222222;--ink:#eeeeee;--ink2:#b4b4b4;--ink3:#7b7b7b;--rule:#2a2a2a;--rule2:#3a3a3a;--accent:#eeeeee;--accent-soft:#2a2a2a;--ok:#3dd68c;--ok-soft:#132d21;--good:#3dd68c;--good-soft:#132d21;--bad:#ff9592;--bad-soft:#3b1219;--amber:#ffca16;--amber-line:#ffc53d;--amber-soft:#302008;--warn:#ffca16;--warn-soft:#302008;--red9:#e5484d;--green9:#30a46c;--amber9:#ffc53d;--focus:#8ab4f8;}}
.bs *{box-sizing:border-box}
:where(.bs) button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.bs button:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r-sm)}
.bs .num{font-variant-numeric:tabular-nums}
.bs-wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.bs-top{background:var(--surface);box-shadow:0 1px 0 var(--rule);padding:22px 0 20px}
.bs-top h1{margin:0;font-size:24px;line-height:1.2;font-weight:650;letter-spacing:-0.01em}
.bs-sub{color:var(--ink2);font-size:13.5px;margin-top:6px}
.bs-ok{color:var(--good);font-size:13px;margin-top:4px}
.bs-tbl td.gone{color:var(--bad);font-weight:600}
.bs-ccys{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:18px}
.bs-ccy{border:0;background:var(--surface);border-radius:var(--r-lg);box-shadow:0 1px 0 var(--rule);padding:14px 16px}
.bs-ccy .code{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--ink3)}
.bs-ccy .row{display:flex;justify-content:space-between;gap:12px;margin-top:6px;font-variant-numeric:tabular-nums}
.bs-ccy .row .k{color:var(--ink2)}
.bs-ccy .row .v{font-weight:600}
.bs-ccy .net{border-top:1px solid var(--rule);margin-top:8px;padding-top:8px}
.bs-ccy .net .v{font-size:20px}
.bs-ccy .ex{margin-top:8px;font-size:12.5px;color:var(--ink3)}
.bs-sec{margin-top:26px}
.bs-sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px}
.bs-sec h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:0;font-weight:600}
.bs-card{background:var(--surface);border:0;border-radius:var(--r-lg);box-shadow:0 1px 0 var(--rule);overflow:hidden}
.bs-items{background:var(--surface);border:0;border-radius:var(--r-lg);box-shadow:0 1px 0 var(--rule);overflow:hidden}
.bs-item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 14px;
border-bottom:1px solid var(--rule)}
.bs-item:last-child{border-bottom:0}
.bs-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px}
.bs-dot.high{background:var(--bad-soft);color:var(--bad)}
.bs-dot.decision{background:var(--accent-soft);color:var(--accent)}
.bs-dot.medium{background:var(--warn-soft);color:var(--warn)}
.bs-item .t{font-weight:600}
.bs-item .d{color:var(--ink2);margin-top:1px;overflow-wrap:anywhere}
.bs-item .src{font-size:12px;color:var(--ink3);margin-top:3px;overflow-wrap:anywhere}
.bs-item .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.bs-item .v.muted{color:var(--ink3);font-weight:500}
.bs-none{padding:14px;color:var(--good);font-weight:600}
.bs-tbl-wrap{padding:0 16px}
.bs-tbl{width:calc(100% - 32px);margin:0 16px;border-collapse:collapse;font-size:13px}
.bs-tbl th{text-align:left;font-weight:600;color:var(--ink3);font-size:11.5px;letter-spacing:.04em;
text-transform:uppercase;padding:10px 6px;border-bottom:1px solid var(--rule)}
.bs-tbl td{padding:11px 6px;border-bottom:1px solid var(--rule);vertical-align:top}
.bs-tbl tr:last-child td{border-bottom:0}
.bs-tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.bs-tbl .muted{color:var(--ink3)}
.bs-tbl .dt{white-space:nowrap}
.bs-pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.bs-pill.ok{background:var(--good-soft);color:var(--good)}
.bs-pill.bad{background:var(--bad-soft);color:var(--bad)}
.bs-pill.part{background:var(--warn-soft);color:var(--warn)}
.bs-tabs{display:flex;gap:4px}
.bs-tabs button{border:0;background:var(--surface);border-radius:var(--r-lg);box-shadow:0 1px 0 var(--rule);padding:3px 11px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.bs-tabs button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.bs-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bs-pad{padding:0 4px 8px;border-top:1px solid var(--rule)}
.bs-two h3{font-size:12.5px;font-weight:600;color:var(--ink2);margin:10px 12px 0}
.bs-disc{width:100%;display:flex;align-items:center;gap:10px;padding:11px 14px;text-align:left}
.bs-disc:hover{background:var(--sunk)}
.bs-disc .caret{color:var(--ink3);font-size:11px;width:10px;transition:transform .12s}
.bs-disc.open .caret{transform:rotate(90deg)}
.bs-disc .lead{font-weight:600}
.bs-disc .gist{color:var(--ink2);font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bs-kv{margin:0;padding:0 14px 12px;list-style:none;font-size:13px}
.bs-kv li{display:flex;gap:10px;align-items:baseline;padding:3px 0}
.bs-kv .what{color:var(--ink3);flex:0 0 96px}
.bs-kv .fn{word-break:break-all}
.bs-fp{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums;word-break:break-all}
.bs-end{margin:28px 0 80px;padding-top:14px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink2);
display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.bs-end p{margin:0;max-width:640px}
.bs-btn{border:1px solid var(--rule2);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;white-space:nowrap}
.bs-btn:hover{background:var(--sunk)}
@media (max-width:640px){.bs-two{grid-template-columns:1fr}.bs-tbl .hide-s{display:none}
.bs-item{grid-template-columns:28px minmax(0,1fr)}.bs-item .v{grid-column:2;text-align:left}}
