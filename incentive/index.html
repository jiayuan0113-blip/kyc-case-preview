.ic{--paper:#f0f0f0;--surface:#fcfcfc;--sunk:#f0f0f0;--ink:#202020;--ink2:#646464;--ink3:#838383;--rule:#e0e0e0;--rule2:#cecece;--r-sm:8px;--r-md:12px;--r-lg:20px;--accent:#202020;--accent-soft:#e8e8e8;--ok:#218358;--ok-soft:#eaf4ee;--good:#218358;--good-soft:#eaf4ee;--bad:#b8262b;--bad-soft:#fbf0f0;--amber:#9a5b00;--amber-line:#e9a83a;--amber-soft:#f9f1dd;--warn:#9a5b00;--warn-soft:#f9f1dd;--red9:#d84a4f;--green9:#30a46c;--amber9:#f3b52a;--focus:#2F6FDB;background:var(--paper);color:var(--ink);
font:14px/1.55 -apple-system,"Segoe UI",Roboto,"PingFang SC",sans-serif;min-height:100vh}
@media (prefers-color-scheme:dark){.ic{--paper:#111111;--surface:#191919;--sunk:#222222;--ink:#eeeeee;--ink2:#b4b4b4;--ink3:#7b7b7b;--rule:#2a2a2a;--rule2:#3a3a3a;--accent:#eeeeee;--accent-soft:#2a2a2a;--ok:#3dd68c;--ok-soft:#132d21;--good:#3dd68c;--good-soft:#132d21;--bad:#ff9592;--bad-soft:#3b1219;--amber:#ffca16;--amber-line:#ffc53d;--amber-soft:#302008;--warn:#ffca16;--warn-soft:#302008;--red9:#e5484d;--green9:#30a46c;--amber9:#ffc53d;--focus:#8ab4f8;}}
.ic *{box-sizing:border-box}
:where(.ic) button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.ic button:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r-sm)}
.ic .num{font-variant-numeric:tabular-nums}
.ic-wrap{max-width:900px;margin:0 auto;padding:0 20px}
.ic-top{background:var(--surface);box-shadow:0 1px 0 var(--rule);padding:22px 0 18px}
.ic-fund{font-size:13px;color:var(--ink2)}
.ic-verdict{font-size:26px;line-height:1.2;font-weight:600;margin:6px 0 0;letter-spacing:-0.01em}
.ic-verdict.ok{color:var(--accent)}
.ic-verdict.short{color:var(--bad)}
.ic-verdict.warn{color:var(--amber)}
.ic-when{margin-top:7px;font-size:13.5px;color:var(--ink2)}
.ic-when b{color:var(--ink);font-weight:600}
.ic-rules{margin-top:14px;border:0;border-radius:var(--r-md);background:var(--sunk);overflow:hidden}
.ic-rules.warn{border-color:var(--amber-line)}
.ic-rules.bad{border-color:var(--bad)}
.ic-rulesbtn{display:flex;width:100%;gap:10px;align-items:center;padding:9px 12px;font-size:12.5px;color:var(--ink2)}
.ic-rulesbtn:hover{background:var(--surface)}
.ic-rulesbtn .caret{color:var(--ink3);font-size:10px;width:9px;flex:0 0 auto}
.ic-rulesbtn .gist{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic-rulesbtn .gist b{color:var(--ink);font-weight:600}
.ic-rulesbody{padding:2px 12px 12px;font-size:12.5px;color:var(--ink2);line-height:1.6}
.ic-rulesbody dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;margin:0}
.ic-rulesbody dt{color:var(--ink3)}
.ic-rulesbody dd{margin:0;word-break:break-word}
.ic-sec{margin-top:26px}
.ic-sec h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin:0 0 10px;font-weight:600}
.ic-todo{border:0;border-radius:var(--r-lg);background:var(--bad-soft);
padding:14px 16px;margin-bottom:10px}
.ic-todo .act{font-size:16px;font-weight:600;line-height:1.35}
.ic-todo .act .amt{font-variant-numeric:tabular-nums}
.ic-todo .where{margin-top:7px;font-size:13px;color:var(--ink2)}
.ic-todo .pace{margin-top:6px;font-size:12.5px;color:var(--ink3)}
.ic-todo.untested{background:var(--surface)}
.ic-todo .why{margin-top:8px;font-size:12.5px;color:var(--ink3);border-top:1px solid var(--rule);padding-top:8px}
.ic-met{background:var(--surface);border:0;border-radius:var(--r-lg);box-shadow:0 1px 0 var(--rule);overflow:hidden;overflow:hidden}
.ic-metbtn{display:flex;width:100%;gap:10px;align-items:center;padding:11px 14px;font-size:13px}
.ic-metbtn:hover{background:var(--sunk)}
.ic-metbtn .caret{color:var(--ink3);font-size:10px;width:9px;flex:0 0 auto}
.ic-metbtn .names{color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic-metbtn .tick{color:var(--accent);font-weight:600;flex:0 0 auto}
.ic-metrow{display:flex;gap:12px;justify-content:space-between;padding:8px 14px;border-top:1px solid var(--rule);font-size:13px}
.ic-metrow .lbl{color:var(--ink2)}
.ic-metrow .val{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.ic-panel{background:var(--surface);border:0;border-radius:var(--r-lg);box-shadow:0 1px 0 var(--rule);overflow:hidden;padding:13px 15px;font-size:13px}
.ic-wait{background:var(--amber-soft);border-radius:var(--r-md);padding:10px 12px;
margin-bottom:8px;font-size:13px;color:var(--ink)}
.ic-wait b{font-weight:600}
.ic-waitbtn{display:flex;gap:10px;align-items:baseline;width:100%}
.ic-waitbtn .caret{color:var(--amber);font-size:10px;width:9px;flex:0 0 auto}
.ic-waitwhy{margin:6px 0 0 19px;font-size:12.5px;color:var(--ink2)}
.ic-note{font-size:12.5px;color:var(--ink3);line-height:1.6;margin-top:8px}
.ic-tbl-wrap{padding:0 16px}
.ic-tbl{width:calc(100% - 32px);margin:0 16px;border-collapse:collapse;font-size:12.5px;margin-top:6px}
.ic-tbl th{text-align:left;font-weight:600;color:var(--ink3);font-size:11px;letter-spacing:.04em;
text-transform:uppercase;padding:10px 6px;border-bottom:1px solid var(--rule)}
.ic-tbl td{padding:11px 6px;border-bottom:1px solid var(--rule);vertical-align:top}
.ic-tbl tr:last-child td{border-bottom:0}
.ic-tbl .ic-paid{font-size:11.5px;color:var(--ink3);margin-top:2px}
.ic-tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.ic-disc{width:100%;display:flex;gap:10px;align-items:center;padding:11px 14px;font-size:13px}
.ic-disc:hover{background:var(--sunk)}
.ic-disc .caret{color:var(--ink3);font-size:10px;width:9px;flex:0 0 auto}
.ic-disc .lead{font-weight:600}
.ic-disc .gist{color:var(--ink2);font-size:12.5px}
.ic-end{margin:26px 0 80px;padding-top:14px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink2);line-height:1.6}
.ic-empty{color:var(--ink3);font-size:13px}
@media (max-width:560px){.ic-verdict{font-size:22px}.ic-metrow{flex-wrap:wrap}}
